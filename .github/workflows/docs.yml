name: Build Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.claude/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Cancel in-progress runs
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Generate documentation from sources
        run: npm run generate
        working-directory: website

      - name: Build documentation
        run: npm run build
        working-directory: website
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Generate summary
        if: always()
        run: |
          echo "## Documentation Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "website/build" ]; then
            echo "Build successful." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To deploy, make the repo public and enable GitHub Pages," >> $GITHUB_STEP_SUMMARY
            echo "or use \`workflow_dispatch\` after configuring deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "Build failed. Check logs above." >> $GITHUB_STEP_SUMMARY
          fi
