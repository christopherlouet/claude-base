name: PR Check

on:
  pull_request:
    # `edited` re-runs the title/WIP gates when the title changes — without it
    # a green check stands after the title is edited to an invalid one (the
    # `ci:`-incident gap; the checks read only the title, so this is cheap).
    types: [opened, edited, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least-privilege default for the GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-validation:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
            hotfix
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The title must start with a lowercase letter.
            Example: "feat: add user authentication"

      - name: Check commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        continue-on-error: true

      # The title reaches the shell through env: substituted into `run:` it is
      # pasted in as source, so a crafted title executed (pinned by
      # tests/ci-downstream.bats).
      - name: Check for WIP
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == *"WIP"* ]]; then
            echo "::warning::This PR is marked as WIP"
            exit 1
          fi

  # The size label is the one step that WRITES, so it runs in its own job, the
  # only one given pull-requests: write; the title/commit/WIP checks above keep
  # the read-only default. The workflow never granted it, and the floating v1
  # tag hid that until it moved on 2026-09-28 to a release that reports the
  # 403: pinned to that release's commit, bumped deliberately. A fork's token
  # stays read-only whatever is declared, so a fork PR skips it.
  size-label:
    name: Label PR size
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check PR size
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: 10
          s_label: 'size/S'
          s_max_size: 100
          m_label: 'size/M'
          m_max_size: 500
          l_label: 'size/L'
          l_max_size: 1000
          xl_label: 'size/XL'
          fail_if_xl: false
          message_if_xl: |
            This PR is very large. Consider splitting it into smaller PRs.
