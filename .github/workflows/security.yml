name: "Security Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ShellCheck security
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: './scripts'
          severity: warning

      # Enforcing (no continue-on-error): a real secret in a non-doc file fails
      # the job. The repo scans clean today — its only planted secrets live in
      # tests/gitleaks.bats (the self-test) and .claude/templates/**/*.tf
      # (placeholder IaC creds), both path-allowlisted in .gitleaks.toml. Docs
      # (.md/.txt) stay allowlisted (removing that yields ~600 example-secret
      # FPs); the write-time secret-scan hook covers the doc surface locally.
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Generate summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ShellCheck: security-focused lint" >> $GITHUB_STEP_SUMMARY
          echo "- Gitleaks: secret scanning" >> $GITHUB_STEP_SUMMARY
