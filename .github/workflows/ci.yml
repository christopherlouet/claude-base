name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # Detect which paths a PR touches, so we can skip the macOS column on
  # doc-only changes. macOS still runs unconditionally on push to main and
  # develop, so any merge that bypassed PR review is still verified.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shell:
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'
              - 'VERSION'
              - '.claude/settings.json'
              - '.claude/presets/**'

  # Non-Bats checks: lint + documentation-count consistency. These run ONCE
  # (the Bats suite is sharded into its own parallel matrix below), so the slow
  # part — the Node/Docusaurus counts gate — is no longer duplicated per test
  # batch. Fast job (~1-2 min); runs in parallel with the bats shards.
  lint-and-counts:
    name: Lint & Counts (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: './scripts'
          # install.sh is the curl|bash entry point and bin/claude-base the
          # dispatcher — both live outside scripts/ and were never linted.
          additional_files: 'install.sh claude-base'
          severity: warning

      - name: Conflict markers (tracked files)
        run: bash scripts/check-conflict-markers.sh

      - name: Validate documentation counts
        run: bash scripts/validate-counts.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package.json

      - name: Install website dependencies
        # No committed lockfile (website/package-lock.json is gitignored — it is
        # a Docusaurus build-time tree, never shipped; keeping it out of the repo
        # removes a recurring class of Dependabot alerts). `npm install` resolves
        # current (patched) transitive versions at build time.
        run: npm --prefix website install

      - name: Website script tests
        # These four (now five) `scripts/*.test.ts` files existed and passed but
        # no workflow ran them, so they guarded nothing. They cover the doc
        # generators, whose output under website/docs/{skills,commands,agents,
        # rules}/ is NOT versioned — the counts gate's `git diff` cannot see it.
        # 54 tests, ~0.3s; the dependencies are already installed above.
        run: npm --prefix website run test:scripts

      - name: Website typecheck
        # Neither Docusaurus nor tsx type-checks: both only strip types. With
        # no step running tsc, website/ went red unseen (a duplicated key in
        # sync-docs' LINK_MAP, a conflicting re-export, and a tsconfig that
        # left out the Docusaurus module declarations). `--noEmit`: the
        # tsconfig declares an outDir, and a plain `tsc` would write to it.
        run: npm --prefix website run typecheck

      - name: Counts gate (regenerate counts.json + injector + git diff)
        run: |
          npm --prefix website run generate
          if ! git diff --exit-code -- counts.json README.md CLAUDE.md docs/ website/docs/ website/sidebars.ts website/docusaurus.config.ts website/src/; then
            echo "::error::counts.json or its consumers are out of sync. Run 'npm --prefix website run generate' locally and commit the result."
            exit 1
          fi

  # Bats suite, sharded across parallel runners. Each shard runs a balanced
  # subset (scripts/test.sh --shard I/N, weighted by file line count) and still
  # parallelizes within itself via bats --jobs. N is `strategy.job-total`, so it
  # auto-syncs with the matrix array — bump the array to add/remove shards.
  # This is the main CI-time lever: the single-runner suite (~6-7 min) drops to
  # the slowest shard (~2 min) since the shards run concurrently.
  bats:
    name: Bats (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: tests/docs-under-claude.bats re-derives every doc the
          # foundation ever shipped from git log, to check FOUNDATION_RETIRED_DOCS
          # is still complete. At the default depth 1 that set collapses to
          # "currently tracked" and the guard skips itself. Cost: ~1s (9 MB).
          fetch-depth: 0

      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0

      - name: Run Bats tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # ./scripts/test.sh runs bats with --jobs (GNU parallel, capped at 8) —
        # ~4x faster than serial; falls back to serial if parallel is absent.
        run: ./scripts/test.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # Gitleaks behavior tests. tests/gitleaks.bats skips itself in every other job
  # (no runner installs gitleaks), so its detection assertions were never actually
  # executed anywhere. This dedicated job installs a pinned gitleaks release binary
  # (verified by SHA-256) and runs that suite — the one place the .gitleaks.toml
  # rules are exercised end-to-end. Kept OUT of the sharded bats matrix on purpose
  # (which shard would receive the file is partition-dependent).
  gitleaks:
    name: Gitleaks behavior (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0

      - name: Install gitleaks (pinned release binary + SHA-256)
        run: |
          set -euo pipefail
          GL_VERSION=8.18.4
          GL_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          GL_TARBALL="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$GL_TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/${GL_TARBALL}"
          echo "${GL_SHA256}  ${GL_TARBALL}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$GL_TARBALL" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify gitleaks is on PATH
        run: gitleaks version

      - name: Run gitleaks behavior tests
        # secret-scan.bats rides along: its gitleaks-branch cases skip
        # themselves in the sharded matrix (no gitleaks installed there), so the
        # one asserting the real binary reads STDIN rather than the working
        # directory would never actually execute. Cheap to repeat, and this is
        # the only job where that case means anything.
        run: bats tests/gitleaks.bats tests/secret-scan.bats

  # The hook policies call awk, and a hook runs on the USER's machine: mawk is
  # Ubuntu's default awk, busybox the awk of Alpine images. The runners above
  # use gawk (ubuntu) and BWK (macOS), so nothing else ever ran the guards under
  # those two. The script refuses to report "ok" if an always-failing awk breaks
  # none of the suites (the shim would not be reaching them).
  awk-portability:
    name: Awk portability (mawk, busybox)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.shell == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0

      # mawk is a "required" Ubuntu package, so the runner already has it (the
      # script exits 2 if not). busybox is fetched like gitleaks above: pinned
      # static binary + SHA-256, no sudo. Upstream publishes no checksum, so the
      # hash was taken on first download (2026-09-27) and is what gets trusted.
      - name: Install busybox (pinned static binary + SHA-256)
        run: |
          set -euo pipefail
          BB_URL=https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
          BB_SHA256=6e123e7f3202a8c1e9b1f94d8941580a25135382b99e8d3e34fb858bba311348
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/busybox" "$BB_URL"
          echo "${BB_SHA256}  $HOME/.local/bin/busybox" | sha256sum -c -
          chmod +x "$HOME/.local/bin/busybox"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Replay the policy suites under mawk and busybox
        run: ./scripts/awk-portability.sh mawk busybox

  # macOS portability check — BSD utilities (sed, awk, date, grep, base64, wc)
  # differ from GNU on Ubuntu. This column verifies ONLY what is portability-
  # sensitive: the bash test suite and the bash count-validator running under
  # macOS's toolchain. ShellCheck (same binary everywhere), the Node/docusaurus
  # counts gate and `npm ci` are platform-independent and already covered by the
  # ubuntu column, so they are intentionally omitted here — that npm install +
  # site generation was the slow part of this job and tested nothing macOS-
  # specific. Sharded like the ubuntu bats matrix: the single-runner suite was
  # ~7 min on macOS — the whole job's cost, since the brew step rides the
  # runner image's bottle cache (~10s) — and drops to the slowest shard (~2
  # min). Runs on every push to main/develop and on PRs touching shell paths
  # (skipped on doc-only PRs). `continue-on-error: true` → never blocks a merge.
  lint-and-test-macos:
    name: Lint & Test (macos-latest)
    runs-on: macos-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.shell == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — see the ubuntu bats matrix above. Sharding is
          # independent per OS, so the guard can land on either one.
          fetch-depth: 0

      - name: Setup Bats, Bash 5+, GNU grep (macOS via Homebrew)
        # macOS ships bash 3.2 (Apple froze updates since GPLv3 in 2007) and
        # BSD grep (different ERE behavior than GNU grep). Homebrew installs:
        #   bash 5+        at /opt/homebrew/bin/bash
        #   GNU grep       at /opt/homebrew/opt/grep/libexec/gnubin/grep
        # PATH is updated below to put GNU grep ahead of BSD grep.
        run: |
          brew install bats-core bash grep parallel
          # Put GNU grep ahead of BSD grep in PATH for subsequent steps
          echo "/opt/homebrew/opt/grep/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Run Bats tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # ./scripts/test.sh runs bats with --jobs (GNU parallel, capped at 8) —
        # ~4x faster than serial; falls back to serial if parallel is absent.
        run: ./scripts/test.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Validate documentation counts (bash portability)
        # Platform-portability probe, not a gate — one shard suffices.
        if: matrix.shard == 1
        run: bash scripts/validate-counts.sh
