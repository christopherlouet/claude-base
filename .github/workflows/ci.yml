name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

      - name: Setup Bats
        uses: bats-core/bats-action@3.0.1

      - name: Run Bats tests
        run: bats tests/*.bats

      - name: Validate documentation counts
        run: bash scripts/validate-counts.sh

      - name: Generate summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ShellCheck: lint on \`scripts/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Bats: 258 tests" >> $GITHUB_STEP_SUMMARY
          echo "- Counts: documentation consistency" >> $GITHUB_STEP_SUMMARY
