name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # Detect which paths a PR touches, so we can skip the macOS column on
  # doc-only changes. macOS still runs unconditionally on push to main and
  # develop, so any merge that bypassed PR review is still verified.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shell:
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'
              - 'VERSION'
              - '.claude/settings.json'
              - '.claude/presets/**'

  lint-and-test:
    name: Lint & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0

      - name: Run Bats tests
        run: bats tests/*.bats

      - name: Validate documentation counts
        run: bash scripts/validate-counts.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Counts gate (regenerate counts.json + injector + git diff)
        run: |
          npm --prefix website run generate
          if ! git diff --exit-code -- counts.json README.md CLAUDE.md docs/ website/docs/ website/sidebars.ts website/docusaurus.config.ts website/src/; then
            echo "::error::counts.json or its consumers are out of sync. Run 'npm --prefix website run generate' locally and commit the result."
            exit 1
          fi

      - name: Generate summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ShellCheck: lint on \`scripts/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Bats: see job logs for the test count" >> $GITHUB_STEP_SUMMARY
          echo "- Counts: documentation consistency (validate-counts.sh + counts.json gate)" >> $GITHUB_STEP_SUMMARY

  # macOS portability check. BSD utilities (sed, awk, find, date, grep, wc)
  # differ from GNU on Ubuntu. Runs:
  #   - on every push to main/develop (catches anything that bypassed PR CI)
  #   - on PRs that touch shell-related paths (scripts, tests, workflows,
  #     VERSION, settings.json, presets) — skipped on doc-only PRs
  # `experimental: true` means failures don't block merges.
  lint-and-test-macos:
    name: Lint & Test (macos-latest)
    runs-on: macos-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.shell == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

      - name: Setup Bats, Bash 5+, GNU grep (macOS via Homebrew)
        # macOS ships bash 3.2 (Apple froze updates since GPLv3 in 2007) and
        # BSD grep (different ERE behavior than GNU grep). Homebrew installs:
        #   bash 5+        at /opt/homebrew/bin/bash
        #   GNU grep       at /opt/homebrew/opt/grep/libexec/gnubin/grep
        # PATH is updated below to put GNU grep ahead of BSD grep.
        run: |
          brew install bats-core bash grep
          # Put GNU grep ahead of BSD grep in PATH for subsequent steps
          echo "/opt/homebrew/opt/grep/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Run Bats tests
        run: bats tests/*.bats

      - name: Validate documentation counts
        run: bash scripts/validate-counts.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Counts gate (regenerate counts.json + injector + git diff)
        run: |
          npm --prefix website run generate
          if ! git diff --exit-code -- counts.json README.md CLAUDE.md docs/ website/docs/ website/sidebars.ts website/docusaurus.config.ts website/src/; then
            echo "::error::counts.json or its consumers are out of sync. Run 'npm --prefix website run generate' locally and commit the result."
            exit 1
          fi
