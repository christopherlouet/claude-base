name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0

      - name: Run Bats tests
        run: bats tests/*.bats tests/migration/*.bats

      - name: Validate documentation counts
        # NOTE: --mixed during the FR->EN migration window (2026-04-30 to ~2026-05-04).
        # After all 4 tier PRs merge, revert to plain `bash scripts/validate-counts.sh`
        # (see T047 in specs/migration-fr-en/tasks.md).
        run: bash scripts/validate-counts.sh --mixed

      - name: Generate summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ShellCheck: lint on \`scripts/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Bats: 258 tests" >> $GITHUB_STEP_SUMMARY
          echo "- Counts: documentation consistency" >> $GITHUB_STEP_SUMMARY
