name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the GITHUB_TOKEN
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        experimental: [false]
        include:
          # macOS is exploratory: BSD utilities (sed, awk, find, date) differ
          # from GNU on Ubuntu. Multi-OS CI is opt-in until portability issues
          # are caught and fixed in dedicated PRs. Failure does NOT block merges.
          - os: macos-latest
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

      - name: Setup Bats (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: bats-core/bats-action@4.0.0

      - name: Setup Bats and Bash 5+ (macOS via Homebrew)
        if: matrix.os == 'macos-latest'
        # macOS ships bash 3.2 as /bin/bash (Apple froze updates since GPLv3 in 2007).
        # The foundation scripts require bash 4+ (mapfile, ${var,,}, etc.).
        # Homebrew installs bash 5+ at /opt/homebrew/bin/bash; the scripts'
        # `#!/usr/bin/env bash` shebang picks it up via PATH.
        run: brew install bats-core bash

      - name: Run Bats tests
        run: bats tests/*.bats

      - name: Validate documentation counts
        run: bash scripts/validate-counts.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Counts gate (regenerate counts.json + injector + git diff)
        run: |
          npm --prefix website run generate
          if ! git diff --exit-code -- counts.json README.md CLAUDE.md docs/ website/docs/ website/sidebars.ts website/docusaurus.config.ts website/src/; then
            echo "::error::counts.json or its consumers are out of sync. Run 'npm --prefix website run generate' locally and commit the result."
            exit 1
          fi

      - name: Generate summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ShellCheck: lint on \`scripts/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Bats: see job logs for the test count" >> $GITHUB_STEP_SUMMARY
          echo "- Counts: documentation consistency (validate-counts.sh + counts.json gate)" >> $GITHUB_STEP_SUMMARY
