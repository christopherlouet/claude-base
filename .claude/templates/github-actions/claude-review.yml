# Claude Code Action - Review automatique des PRs
# Source: https://github.com/anthropics/claude-code-action
#
# Prerequis: une cle API Anthropic (pay-per-use). Le plan Max (OAuth) ne
#   fonctionne pas en CI car il necessite une authentification interactive.
#   Alternatives: Amazon Bedrock, Google Vertex AI, ou Microsoft Foundry.
#
# Setup:
#   1. Ajouter ANTHROPIC_API_KEY dans Settings > Secrets > Actions
#   2. Copier ce fichier dans .github/workflows/claude-review.yml
#   3. (Optionnel) Lancer `/install-github-app` dans Claude Code pour setup complet
#
# Usage:
#   - Review automatique a chaque PR ouverte/mise a jour
#   - Mentionner @claude dans un commentaire PR pour poser des questions
#   - Mentionner @claude dans une issue pour demander une implementation

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  # Review automatique des PRs
  auto-review:
    if: >
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request:

            ## Code Quality
            - [ ] Code follows project conventions
            - [ ] No commented-out code or debug statements
            - [ ] DRY principle followed

            ## Testing
            - [ ] Tests present for new code
            - [ ] Edge cases covered

            ## Security
            - [ ] No hardcoded credentials or secrets
            - [ ] Input validation where needed
            - [ ] No sensitive data in logs

            ## Documentation
            - [ ] CHANGELOG updated if needed
            - [ ] Commit messages follow Conventional Commits

            Post a summary comment with checklist results.
            Use inline comments for specific code issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  # Repondre aux mentions @claude dans les PRs et issues
  claude-mention:
    if: >
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE/PR NUMBER: ${{ github.event.issue.number }}
            COMMENT BY: ${{ github.event.comment.user.login }}

            Respond to this comment:
            ${{ github.event.comment.body }}

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh issue comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Glob,Grep"
