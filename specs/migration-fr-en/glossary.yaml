# =============================================================================
# Glossary FR -> EN — claude-socle migration
# =============================================================================
# Structure:
#   terms:
#     - fr: <french term>      # source term (lowercase, canonical form)
#       en: <english term>     # canonical translation
#       forbidden: [...]       # alternative translations explicitly rejected
#       context: <note>        # optional clarification
#       locked: false          # set to true after T025 (Friday morning checkpoint)
#
# Locking:
#   - Set globally: locked_at: "YYYY-MM-DD"
#   - Per-term: locked: true
#   - Once locked, only --force to lock-glossary.sh allows modification.
#
# Validator:
#   scripts/migration/check-glossary.sh enforces these on EN files.
# =============================================================================

locked_at: null  # set by lock-glossary.sh on Friday morning

terms:
  # ---------------------------------------------------------------------------
  # Core domain (most frequent)
  # ---------------------------------------------------------------------------
  - fr: socle
    en: foundation
    forbidden: [scaffold, base, framework, kit]
    context: "claude-socle is 'the foundation' — central concept of the project"

  - fr: agent
    en: agent
    context: "verbatim — same word in EN"

  - fr: regle
    en: rule
    forbidden: [policy, guideline]

  - fr: regles
    en: rules
    forbidden: [policies, guidelines]

  - fr: etape
    en: step
    forbidden: [stage, phase]
    context: "phase = bigger grouping in plans"

  - fr: phase
    en: phase
    forbidden: [stage]

  - fr: boucle
    en: loop
    forbidden: [cycle, iteration]
    context: "cycle is reserved for Red-Green-Refactor; iteration for sprint"

  - fr: cycle
    en: cycle
    context: "canonical for FR 'cycle' (e.g., Red-Green-Refactor cycle) — but flagged as forbidden translation of 'boucle' so check-glossary will warn if it appears unexpectedly. Manual review needed when both terms are present in the same project."

  - fr: audit
    en: audit
    forbidden: [inspection, check]
    context: "review is fine when translating 'revue' but not 'audit'; the validator cannot disambiguate so we don't blacklist it"

  - fr: revue
    en: review
    forbidden: [inspection]
    context: "audit dropped from forbidden — it's a valid translation of FR 'audit'"

  - fr: chantier
    en: project
    forbidden: [worksite, jobsite, work]
    context: "as in 'big project / migration'"

