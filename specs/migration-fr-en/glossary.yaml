# =============================================================================
# Glossary FR -> EN — claude-socle migration
# =============================================================================
# Structure:
#   terms:
#     - fr: <french term>      # source term (lowercase, canonical form)
#       en: <english term>     # canonical translation
#       forbidden: [...]       # alternative translations explicitly rejected
#       context: <note>        # optional clarification
#       locked: false          # set to true after T025 (Friday morning checkpoint)
#
# Locking:
#   - Set globally: locked_at: "YYYY-MM-DD"
#   - Per-term: locked: true
#   - Once locked, only --force to lock-glossary.sh allows modification.
#
# Validator:
#   scripts/migration/check-glossary.sh enforces these on EN files.
# =============================================================================



