    context: "verbatim — software lifecycle hook"

  - fr: hooks
    en: hooks

  - fr: equipe
    en: team
    forbidden: [crew, squad]

  - fr: lancement
    en: launch
    forbidden: [release, kickoff]
    context: "release is for shipping a version; launch is for product/project start"

  - fr: release
    en: release
    context: "verbatim — shipping a new version"

  - fr: deploiement
    en: deployment
    forbidden: [deploy]

  - fr: rollback
    en: rollback
    context: "verbatim"

  - fr: revert
