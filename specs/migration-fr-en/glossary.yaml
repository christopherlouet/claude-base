  # ---------------------------------------------------------------------------
  - fr: workflow
    en: workflow
    context: "verbatim"

  - fr: tache
    en: task
    forbidden: [job, work-item]

  - fr: taches
    en: tasks

  - fr: feature
    en: feature
    context: "verbatim"

  - fr: bugfix
    en: bugfix
    context: "verbatim"

  - fr: dette
    en: debt
    forbidden: [liability, debit]

  - fr: dette technique
