# Dependabot for the GitHub Actions your workflows use.
#
# The workflows claude-base installed pin each action to a commit SHA, with its
# version in a trailing comment: a tag is a pointer its owner can move, and
# these workflows run with your repository's token. This keeps those pins
# current: Dependabot bumps the SHA and the comment together, in a weekly PR.
#
# Add your own package ecosystems (npm, pip, gomod...) below as you need them.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
