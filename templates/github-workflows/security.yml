# Secret scan, installed by `claude-base init --ci`.
#
# Runs the Gitleaks CLI from its pinned container image over the whole git
# history. The gitleaks GitHub Action is not used on purpose: it requires a
# license key on organization-owned repositories, so it would fail there on
# the first push. A `.gitleaks.toml` at the repository root, if you add one,
# is picked up automatically. Edit this file freely: the installer never
# overwrites a security.yml that already exists.
name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner --verbose .
