# CI for this project, installed by `claude-base init --ci`.
#
# Stack-neutral on purpose: it looks at what the repository actually has and
# runs only that. A stack it cannot find is skipped with a notice, never
# failed, and a script the project does not define is never invented. Edit it
# freely: the installer never overwrites a ci.yml that already exists.
#
#   Node    package.json      install, then the lint / typecheck / test / build
#                             scripts that exist (npm, pnpm or yarn by lockfile)
#   Python  pyproject.toml    install (pip, uv or poetry by lockfile), then ruff
#           requirements.txt  and pytest when they are installed
#   Go      go.mod            go vet, go test
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.stack.outputs.node }}
      python: ${{ steps.stack.outputs.python }}
      go: ${{ steps.stack.outputs.go }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect
        id: stack
        run: |
          node=false; python=false; go=false
          if [ -f package.json ]; then node=true; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then python=true; fi
          if [ -f go.mod ]; then go=true; fi
          {
            echo "node=$node"
            echo "python=$python"
            echo "go=$go"
          } >> "$GITHUB_OUTPUT"
          if [ "$node$python$go" = "falsefalsefalse" ]; then
            echo "::notice::No package.json, pyproject.toml, requirements.txt or go.mod at the repository root - nothing to build or test yet."
          fi

  node:
    name: Node
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint, type-check, test, build
        run: |
          pm=npm
          if [ -f pnpm-lock.yaml ]; then pm=pnpm; elif [ -f yarn.lock ]; then pm=yarn; fi

          # has_script <name> — true when package.json defines that script.
          has_script() {
            node -e 'const s = require("./package.json").scripts || {}; process.exit(s[process.argv[1]] ? 0 : 1)' "$1"
          }
          # `npm init -y` writes a test script that always exits 1. It is no
          # suite, not a red one: running it would fail a project with no tests.
          is_placeholder_test() {
            node -e 'const s = require("./package.json").scripts || {}; process.exit(s.test === "echo \"Error: no test specified\" && exit 1" ? 0 : 1)'
          }

          ran=0
          for script in lint typecheck test build; do
            if ! has_script "$script"; then
              continue
            fi
            if [ "$script" = test ] && is_placeholder_test; then
              echo "::notice::package.json test script is npm's placeholder - tests skipped. Replace it with a real test command."
              continue
            fi
            echo "::group::$pm run $script"
            "$pm" run "$script"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "::notice::package.json defines none of lint, typecheck, test, build - nothing to run."
          fi

  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f uv.lock ]; then
            pip install uv
            uv sync --all-extras --dev
          elif [ -f poetry.lock ]; then
            pipx install poetry
            poetry install
          else
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
            # Only a pyproject that declares how it builds can be installed;
            # without [build-system] pip guesses, and guesses wrong.
            if [ -f pyproject.toml ] && grep -q '^\[build-system\]' pyproject.toml; then
              pip install -e ".[dev]" || pip install -e .
            fi
          fi

      - name: Lint and test
        run: |
          run=""
          if [ -f uv.lock ]; then run="uv run"; elif [ -f poetry.lock ]; then run="poetry run"; fi

          if $run ruff --version >/dev/null 2>&1; then
            echo "::group::ruff check"
            $run ruff check .
            echo "::endgroup::"
          else
            echo "::notice::ruff is not installed - lint skipped."
          fi

          if $run python -m pytest --version >/dev/null 2>&1; then
            echo "::group::pytest"
            status=0
            $run python -m pytest || status=$?
            echo "::endgroup::"
            # Exit 5 means "no tests collected": a project without tests yet.
            if [ "$status" -eq 5 ]; then
              echo "::notice::pytest collected no tests."
            elif [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          else
            echo "::notice::pytest is not installed - tests skipped."
          fi

  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
