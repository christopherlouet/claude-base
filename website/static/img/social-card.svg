<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Logo on the left -->
  <g transform="translate(100, 215)">
    <circle cx="100" cy="100" r="90" fill="white" opacity="0.15" />
    <g fill="white">
      <!-- Left bracket -->
      <path d="M50 60 L70 60 L70 70 L60 70 L60 130 L70 130 L70 140 L50 140 Z" />
      <!-- Right bracket -->
      <path d="M150 60 L130 60 L130 70 L140 70 L140 130 L130 130 L130 140 L150 140 Z" />
      <!-- Center dots -->
      <circle cx="84" cy="100" r="10" />
      <circle cx="116" cy="100" r="10" />
      <!-- Arrow -->
      <path d="M94 100 L106 100 L102 94 L112 100 L102 106 L106 100" fill="none" stroke="white" stroke-width="4" />
    </g>
  </g>

  <!-- Main title -->
  <text x="350" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="bold" fill="white">
    claude-base
  </text>

  <!-- Subtitle -->
  <text x="350" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="42" fill="white" opacity="0.9">
    Template Claude Code
  </text>

  <!-- Stats -->
  <text x="350" y="430" font-family="system-ui, -apple-system, monospace" font-size="28" fill="white" opacity="0.85">
    120 Commands | 57 Agents | 41 Skills | 21 Rules
  </text>

  <!-- Workflow tagline -->
  <text x="350" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="white" opacity="0.75" font-style="italic">
    Explore → Specify → Plan → TDD → Commit
  </text>
</svg>
